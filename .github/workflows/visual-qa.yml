name: Visual QA

on:
  # Nightly, after CI's drift check — visual regressions are caught on main.
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch: {}

# Forked PRs never see Supabase keys: the stack is fully local, so this job is
# safe on schedule + manual runs only.
permissions:
  contents: read

jobs:
  visual-qa:
    # The remote repos sharing this file have different runner availability;
    # only the primary origin runs the full stack.
    if: github.repository == 'bushninjadots/tethyr-main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Brings up postgres/auth/rest/storage, applies all migrations + seed.
      - name: Start Supabase
        run: npx supabase start
        # Wait for the stack (first init applies 170+ migrations).
        timeout-minutes: 10

      - name: Read Supabase keys
        id: keys
        run: |
          STATUS_ENV="$(npx supabase status -o env)"
          PK="$(printf '%s\n' "$STATUS_ENV" | sed -n 's/^PUBLISHABLE_KEY="\(.*\)"$/\1/p')"
          SK="$(printf '%s\n' "$STATUS_ENV" | sed -n 's/^SECRET_KEY="\(.*\)"$/\1/p')"
          {
            echo "publishable=$PK"
            echo "service_role=$SK"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The app reads SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY from the real
      # environment (resolveSupabaseEnv prefers them server-side); the browser
      # client needs the URL the headless browser can reach — localhost works
      # because the runner hosts both server and browser.
      - name: Start dev server
        run: |
          npm run dev -- --host 127.0.0.1 --port 3000 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/ >/dev/null
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_PUBLISHABLE_KEY: ${{ steps.keys.outputs.publishable }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.keys.outputs.service_role }}
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ steps.keys.outputs.publishable }}

      - name: Run visual audit (21 pages, desktop + mobile)
        run: node scripts/qa-audit.mjs
        env:
          QA_BASE: http://127.0.0.1:3000

      - name: Run workflow click-throughs
        run: node scripts/qa-workflows.mjs
        env:
          QA_BASE: http://127.0.0.1:3000

      # Two-user loop: create → role → apply → accept → People contributor.
      # Closes the Stage 0 "project-creation/People click-through" gap.
      - name: Run project-loop click-through (two users)
        run: node scripts/qa-project-loop.mjs
        env:
          QA_BASE: http://127.0.0.1:3000
          QA_SB_REST: http://127.0.0.1:54321

      # Two-user loop: create → join → submit → pass → pass-gated rewards.
      - name: Run challenge-loop click-through (two users)
        run: node scripts/qa-challenge-loop.mjs
        env:
          QA_BASE: http://127.0.0.1:3000
          QA_SB_REST: http://127.0.0.1:54321

      # Explore quick-look: card → overlay → title link → project page →
      # deep link (?project=<id>) → close clears the param.
      - name: Run explore-overlay click-through
        run: node scripts/qa-explore-overlay.mjs
        env:
          QA_BASE: http://127.0.0.1:3000

      # Owner /profile vs public /u/:handle: same block count, same
      # studio-block frames, same full-bleed opt-outs.
      - name: Run studio-parity click-through
        run: node scripts/qa-studio-parity.mjs
        env:
          QA_BASE: http://127.0.0.1:3000

      # Profile-picture shape: appearance dialog → both Studios render the
      # silhouette → reset restores the circle default.
      - name: Run avatar-shape click-through
        run: node scripts/qa-avatar-shape.mjs
        env:
          QA_BASE: http://127.0.0.1:3000

      - name: Upload screenshots + report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts
          path: qa-artifacts/
          retention-days: 14
