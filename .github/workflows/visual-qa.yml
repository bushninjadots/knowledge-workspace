name: Visual QA

on:
  # Nightly, after CI's drift check — visual regressions are caught on main.
  # Also on pull_request: the Studio editor is the flagship customization
  # surface, and the harnesses below are the only thing standing between a
  # layout regression and the creator-facing product. They need a browser and
  # a running Supabase stack, so this is the expensive job — it stays separate
  # from ci.yml, which must stay fast and key-free.
  pull_request:
    paths:
      - "src/components/tethyr/studio/**"
      - "src/components/tethyr/blocks/**"
      - "src/components/tethyr/page/**"
      - "src/routes/**"
      - "src/components/tethyr/project/**"
      - "src/components/tethyr/profile/**"
      - "scripts/qa-*.mjs"
      - ".github/workflows/visual-qa.yml"
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch: {}

# The local Supabase stack needs no secrets, so these jobs are safe to run on
# any pull request. The repo guard below is about *runner availability*, not
# about secret safety.
permissions:
  contents: read

jobs:
  # Builds the real deployable artifact (the single-file fetch bundle) and
  # probes it with plain fetch — the only check that catches the bundle's
  # init-order failure class, where an unrelated content change merges eager
  # server-function modules into an early router chunk and every SSR page
  # 500s ("createServerFn is not a function") while dev and unit tests stay
  # green. AGENTS.md documents two shipped instances of this class.
  prod-bundle:
    if: ${{ contains(fromJSON('["bushninjadots/tethyr-main","bushninjadots/tethyr-3b702bae"]'), github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # The probe asserts SSR content that depends on seeded data, so the
      # local stack must be up — same pattern the visual-qa job uses.
      - name: Start Supabase
        run: npx supabase start
        timeout-minutes: 10

      - name: Read Supabase keys
        id: keys
        run: |
          STATUS_ENV="$(npx supabase status -o env)"
          PK="$(printf '%s\n' "$STATUS_ENV" | sed -n 's/^PUBLISHABLE_KEY="\(.*\)"$/\1/p')"
          SK="$(printf '%s\n' "$STATUS_ENV" | sed -n 's/^SECRET_KEY="\(.*\)"$/\1/p')"
          {
            echo "publishable=$PK"
            echo "service_role=$SK"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The VITE_ pair is baked into the client bundle at build time; the
      # bare pair is read by resolveSupabaseEnv server-side at runtime.
      - name: Build production bundle
        run: npm run build:prod
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_PUBLISHABLE_KEY: ${{ steps.keys.outputs.publishable }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.keys.outputs.service_role }}
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ steps.keys.outputs.publishable }}

      - name: Probe every public route through the bundle
        run: node scripts/prod-bundle-probe.mjs
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_PUBLISHABLE_KEY: ${{ steps.keys.outputs.publishable }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.keys.outputs.service_role }}

  visual-qa:
    # Both remotes that share this file get the full stack: `origin` is the
    # canonical repo, `loveable` is the Lovable-connected one whose pushed
    # branch syncs back into the Lovable editor — a Studio regression landed
    # there is visible to the user immediately, so it must be gated there too.
    if: ${{ contains(fromJSON('["bushninjadots/tethyr-main","bushninjadots/tethyr-3b702bae"]'), github.repository) }}
    runs-on: ubuntu-latest
    # Twelve browser harnesses, several of which own a browser for minutes
    # (the project/challenge loop runners drive two accounts end to end).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Brings up postgres/auth/rest/storage, applies all migrations + seed.
      - name: Start Supabase
        run: npx supabase start
        # Wait for the stack (first init applies 170+ migrations).
        timeout-minutes: 10

      - name: Read Supabase keys
        id: keys
        run: |
          STATUS_ENV="$(npx supabase status -o env)"
          PK="$(printf '%s\n' "$STATUS_ENV" | sed -n 's/^PUBLISHABLE_KEY="\(.*\)"$/\1/p')"
          SK="$(printf '%s\n' "$STATUS_ENV" | sed -n 's/^SECRET_KEY="\(.*\)"$/\1/p')"
          {
            echo "publishable=$PK"
            echo "service_role=$SK"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The app reads SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY from the real
      # environment (resolveSupabaseEnv prefers them server-side); the browser
      # client needs the URL the headless browser can reach — localhost works
      # because the runner hosts both server and browser.
      - name: Start dev server
        run: |
          npm run dev -- --host 127.0.0.1 --port 3000 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/ >/dev/null
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_PUBLISHABLE_KEY: ${{ steps.keys.outputs.publishable }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.keys.outputs.service_role }}
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ steps.keys.outputs.publishable }}

      - name: Run visual audit (21 pages, desktop + mobile)
        run: node scripts/qa-audit.mjs
        env:
          QA_BASE: http://127.0.0.1:3000

      # CSP plumbing: every inline script carries the request's nonce, the
      # client router learns it from <meta property="csp-nonce">, and no markup
      # relies on inline event handlers (which no nonce can cover). The dev
      # server serves the policy report-only, so a nonce-less script shows up
      # here as a violation instead of only breaking production.
      - name: Run CSP nonce check
        run: node scripts/qa-csp.mjs
        env:
          QA_BASE: http://127.0.0.1:3000

      - name: Run workflow click-throughs
        run: node scripts/qa-workflows.mjs
        env:
          QA_BASE: http://127.0.0.1:3000

      # Two-user loop: create → role → apply → accept → People contributor.
      # Closes the Stage 0 "project-creation/People click-through" gap.
      - name: Run project-loop click-through (two users)
        run: node scripts/qa-project-loop.mjs
        env:
          QA_BASE: http://127.0.0.1:3000
          QA_SB_REST: http://127.0.0.1:54321

      # Two-user loop: create → join → submit → pass → pass-gated rewards.
      - name: Run challenge-loop click-through (two users)
        run: node scripts/qa-challenge-loop.mjs
        env:
          QA_BASE: http://127.0.0.1:3000
          QA_SB_REST: http://127.0.0.1:54321

      # Explore quick-look: card → overlay → title link → project page →
      # deep link (?project=<id>) → close clears the param.
      - name: Run explore-overlay click-through
        run: node scripts/qa-explore-overlay.mjs
        env:
          QA_BASE: http://127.0.0.1:3000

      # Owner /profile vs public /u/:handle: same block count, same
      # studio-block frames, same full-bleed opt-outs.
      - name: Run studio-parity click-through
        run: node scripts/qa-studio-parity.mjs
        env:
          QA_BASE: http://127.0.0.1:3000

      # Profile-picture shape: appearance dialog → both Studios render the
      # silhouette → reset restores the circle default.
      - name: Run avatar-shape click-through
        run: node scripts/qa-avatar-shape.mjs
        env:
          QA_BASE: http://127.0.0.1:3000

      # The Studio is the flagship customization surface (g-studio-surface.tsx
      # is the single largest file in src/), so its audits are gates, not
      # optional extras. These three cover the owner view, the editor, and the
      # paths the 2026-09-27 audit explicitly did not.
      - name: Run studio editor audit
        run: node scripts/qa-studio.mjs
        env:
          QA_BASE: http://127.0.0.1:3000
          QA_EMAIL: maya@tethyr.dev
          QA_PASSWORD: password123

      - name: Run studio owner-view audit
        run: node scripts/qa-studio-view.mjs
        env:
          QA_BASE: http://127.0.0.1:3000
          QA_EMAIL: maya@tethyr.dev
          QA_PASSWORD: password123

      # Reordering, dark-theme contrast, and the template publish round trip.
      - name: Run studio blind-spot audit
        run: node scripts/qa-studio-blindspots.mjs
        env:
          QA_BASE: http://127.0.0.1:3000
          QA_EMAIL: maya@tethyr.dev
          QA_PASSWORD: password123

      # Text extremes: 2000-char bio, markdown-heavy README, 60-char names.
      # Seeds straight to the DB, so it needs the service key (available here
      # — this job already reads it from `supabase status`).
      - name: Run long-content audit
        run: node scripts/qa-long-content.mjs
        env:
          QA_BASE: http://127.0.0.1:3000
          QA_EMAIL: maya@tethyr.dev
          QA_PASSWORD: password123
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_PUBLISHABLE_KEY: ${{ steps.keys.outputs.publishable }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.keys.outputs.service_role }}

      - name: Upload screenshots + report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts
          path: qa-artifacts/
          retention-days: 14
